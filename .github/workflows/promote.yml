name: Build, test, promote to release

on:
  push:
    branches: [unstable]

# Don't let two promotions race each other
concurrency:
  group: promote-release
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.1.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev libssl-dev

      - name: Configure
        run: >
          cmake --preset default
          -DCMAKE_CXX_COMPILER=g++-14
          -DPython_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build --preset default --parallel

      - name: Test
        run: |
          pip install pytest
          PYTHONPATH=build pytest tests/

  promote:
    needs: build-and-test         
    runs-on: ubuntu-latest
    permissions:
      contents: write            
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       

      - name: Merge unstable into release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout release
          git merge --ff-only ${{ github.sha }}
          git push origin release
